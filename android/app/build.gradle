plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.douyintool'
    compileSdk 34

    defaultConfig {
        applicationId "com.local.douyintool"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
